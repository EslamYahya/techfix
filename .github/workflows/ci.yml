name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: techfix, POSTGRES_PASSWORD: techfix, POSTGRES_DB: techfix }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U techfix" --health-interval 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://techfix:techfix@localhost:5432/techfix
      REDIS_URL: redis://localhost:6379 # enables the real-Redis queue tests
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @techfix/db generate
      - run: pnpm --filter @techfix/db validate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  # Runs the very same API tests against PostgreSQL + PostGIS (the Prisma adapters). It starts working as
  # soon as the baseline migration is committed (see docs/ops/launch-checklist.md, gate 1).
  db-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: techfix, POSTGRES_PASSWORD: techfix, POSTGRES_DB: techfix }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U techfix" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://techfix:techfix@localhost:5432/techfix
      TEST_DATABASE_URL: postgresql://techfix:techfix@localhost:5432/techfix
    steps:
      - uses: actions/checkout@v4
      - name: Has a baseline migration?
        id: mig
        run: |
          if ls packages/db/prisma/migrations/*/migration.sql >/dev/null 2>&1; then echo "have=true" >> "$GITHUB_OUTPUT"; fi
      - if: steps.mig.outputs.have == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.mig.outputs.have == 'true'
        uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: pnpm }
      - if: steps.mig.outputs.have == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @techfix/db generate
          pnpm --filter @techfix/db migrate:deploy
          pnpm turbo run build --filter=@techfix/domain --filter=@techfix/contracts --filter=@techfix/db
          pnpm --filter @techfix/api test:db

  images:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f infra/docker/api.Dockerfile -t techfix-api:ci .
      - run: docker build -f infra/docker/web.Dockerfile -t techfix-web:ci .
