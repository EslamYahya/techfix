# Local development services. Start with: pnpm infra:up
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: techfix
      POSTGRES_PASSWORD: techfix
      POSTGRES_DB: techfix
    ports: ['5434:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U techfix']
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10
  minio:
    build:
      context: ..
      dockerfile: infra/docker/minio.Dockerfile
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    image: techfix-minio:local
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: techfix
      MINIO_ROOT_PASSWORD: techfix-secret
    ports: ['9000:9000', '9001:9001']
    volumes: [miniodata:/data]
  mailpit:
    image: axllent/mailpit:latest
    ports: ['1025:1025', '8025:8025']
volumes:
  pgdata:
  miniodata:
